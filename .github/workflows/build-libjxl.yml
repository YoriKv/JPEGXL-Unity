# Builds libjxl 0.12.0 shared libraries for the macOS and Linux editors.
# Outputs are downloaded and committed into Assets/JPEGXL/Plugins/Editor/{OSX,Linux}; see Docs/JXL-Importer-Plan.md.
name: build-libjxl
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-libjxl.yml']
env:
  LIBJXL_REF: v0.12.0
  CMAKE_FLAGS: >-
    -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DJPEGXL_STATIC=OFF -DBUILD_TESTING=OFF
    -DJPEGXL_ENABLE_TOOLS=OFF -DJPEGXL_ENABLE_BENCHMARK=OFF -DJPEGXL_ENABLE_EXAMPLES=OFF
    -DJPEGXL_ENABLE_MANPAGES=OFF -DJPEGXL_ENABLE_DOXYGEN=OFF -DJPEGXL_ENABLE_SJPEG=OFF
    -DJPEGXL_ENABLE_OPENEXR=OFF -DJPEGXL_ENABLE_PLUGINS=OFF -DJPEGXL_ENABLE_VIEWERS=OFF
    -DJPEGXL_ENABLE_JNI=OFF -DJPEGXL_ENABLE_DEVTOOLS=OFF -DJPEGXL_ENABLE_JPEGLI=OFF
    -DJPEGXL_BUNDLE_LIBPNG=OFF -DJPEGXL_ENABLE_TCMALLOC=OFF -DJPEGXL_ENABLE_FUZZERS=OFF
    -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-arm64, rpath: '@loader_path', arch: arm64 }
          - { os: macos-15-intel, name: macos-x86_64, rpath: '@loader_path', arch: x86_64 }
          - { os: ubuntu-22.04, name: linux-x86_64, rpath: '$ORIGIN', arch: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: libjxl/libjxl
          ref: v0.12.0
          submodules: recursive
          path: libjxl
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Configure
        working-directory: libjxl
        run: |
          EXTRA=""
          if [ "${{ runner.os }}" = "Linux" ]; then export CC=clang CXX=clang++; fi
          if [ "${{ runner.os }}" = "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"; fi
          cmake -B build -G Ninja ${{ env.CMAKE_FLAGS }} -DCMAKE_INSTALL_RPATH='${{ matrix.rpath }}' $EXTRA
      - name: Build
        working-directory: libjxl
        run: cmake --build build --target jxl jxl_cms jxl_threads
      - name: Collect and normalise names
        working-directory: libjxl
        run: |
          mkdir -p out
          # Keep one file per library under the name Unity probes for DllImport("jxl") etc. (dereferenced symlinks).
          for lib in jxl jxl_cms jxl_threads brotlicommon brotlidec brotlienc; do
            src=$(find build -type l \( -name "lib$lib.dylib" -o -name "lib$lib.so" \) | head -1)
            [ -n "$src" ] || src=$(find build -type f \( -name "lib$lib.*.dylib" -o -name "lib$lib.so.*" \) | head -1)
            ext=${src##*.}; case "$src" in *.dylib) ext=dylib;; *) ext=so;; esac
            cp -L "$src" "out/lib$lib.$ext"
          done
          cd out
          if [ "${{ runner.os }}" = "macOS" ]; then
            for f in *.dylib; do install_name_tool -id "@rpath/$f" "$f"; done
            for f in *.dylib; do
              for dep in $(otool -L "$f" | awk 'NR>1 {print $1}' | grep '^@rpath/'); do
                base=$(basename "$dep"); plain=$(echo "$base" | sed -E 's/\.[0-9]+(\.[0-9]+)*\.dylib$/.dylib/')
                [ "$base" != "$plain" ] && install_name_tool -change "$dep" "@rpath/$plain" "$f"
              done
              install_name_tool -add_rpath @loader_path "$f" 2>/dev/null || true
              codesign -s - -f "$f"
            done
          else
            sudo apt-get install -y patchelf
            for f in *.so; do
              patchelf --set-soname "$f" "$f"
              for dep in $(patchelf --print-needed "$f" | grep -E '^lib(jxl|brotli)'); do
                plain=$(echo "$dep" | sed -E 's/\.so\.[0-9.]+$/.so/')
                [ "$dep" != "$plain" ] && patchelf --replace-needed "$dep" "$plain" "$f"
              done
              patchelf --set-rpath '$ORIGIN' "$f"
            done
          fi
          ls -la
          echo "--- dependencies:"
          for f in *; do echo "== $f"; (otool -L "$f" 2>/dev/null; otool -l "$f" 2>/dev/null | grep -A2 LC_RPATH | grep path) || (readelf -d "$f" | grep -E 'NEEDED|RUNPATH|RPATH|SONAME'); done
      - uses: actions/upload-artifact@v4
        with:
          name: libjxl-${{ matrix.name }}
          path: libjxl/out/
          if-no-files-found: error
  universal:
    needs: build
    runs-on: macos-14
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libjxl-macos-arm64
          path: arm64
      - uses: actions/download-artifact@v4
        with:
          name: libjxl-macos-x86_64
          path: x86_64
        continue-on-error: true
      - name: lipo
        run: |
          mkdir -p universal
          for f in arm64/*.dylib; do b=$(basename "$f"); if [ -f "x86_64/$b" ]; then lipo -create "$f" "x86_64/$b" -output "universal/$b"; else cp "$f" "universal/$b"; fi; done
          for f in universal/*; do codesign -s - -f "$f"; echo "== $f"; lipo -info "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: libjxl-macos-universal
          path: universal/
          if-no-files-found: error
